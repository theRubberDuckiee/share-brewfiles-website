name: Warp PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  review:
    # Prefer a self-hosted Linux runner that you've authenticated with `warp login`
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # If your runner doesn't have the CLI yet, install it once or ensure it's in PATH.
      # (On Linux, you can install the standalone package; see docs for distro-specific repos.)
      # https://docs.warp.dev/developers/cli
      # Example invocation:
      - name: Show Warp CLI version
        run: warp --version

      - name: Generate diff
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff origin/main... > diff.patch

      - name: Run Warp reviewer agent
        run: |
          warp agent run \
            --saved-prompt QqfvqjGrSYmkoHNhfgrpov \
