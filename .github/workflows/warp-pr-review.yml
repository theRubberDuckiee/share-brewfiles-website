name: Warp PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  review:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Warp CLI
        run: |
          brew tap warpdotdev/warp
          brew update
          brew install --cask warp-cli

      - name: Check Warp CLI authentication options
        run: |
          echo "Checking Warp CLI help for authentication options:"
          warp --help | grep -i auth || echo "No auth options found in help"
          echo "Checking if WARP_TOKEN environment variable is supported:"
          warp agent --help | grep -i token || echo "No token options found in agent help"

      - name: Generate diff
        run: |
          git fetch origin main
          git diff origin/main HEAD > diff.patch

      - name: Run Warp reviewer agent
        run: |
          warp agent run \
            --prompt diff.patch \
