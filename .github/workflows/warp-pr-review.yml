name: Warp PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  review:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Warp CLI
        run: |
          brew tap warpdotdev/warp
          brew update
          brew install --cask warp-cli

      - name: Login to Warp
        run: warp login

      - name: Generate diff
        run: |
          git fetch origin main
          git diff origin/main HEAD > diff.patch

      - name: Run Warp reviewer agent
        run: |
          warp agent run \
            --prompt diff.patch \
